# https://share.google/aimode/HEO3xf7J6202ID5l7
name: Generate and Email Report

on:
  schedule:
    # Runs every day at 12:00 AM UTC (Adjust using cron syntax)
    - cron: '0 0 1 * *'
  # Allows you to also trigger this manually from the Actions tab
  workflow_dispatch:

jobs:
  run-dfm_reporting-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the repository code.
      - name: Check out repository code
        uses: actions/checkout@v5

      # 2. Install Poetry before setting up Python so setup-python can find it for caching
      - name: Install Poetry
        run: pipx install poetry

      # 3. Set up Python and cache Poetry dependencies
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry' # Automatically hashes and caches your poetry.lock

       # 4. Install dependencies defined in pyproject.toml
      - name: Install Dependencies
        run: poetry install --no-interaction

      # 5. Run the script, securely injecting repository secrets.
      - name: Run Python Script
        # This maps the GitHub Secret to an environment variable for this step.
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: 587
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python automatically_run_report.py
