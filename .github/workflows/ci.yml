name: Python CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

  lint-cruft:
    name: Check Project Template Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify no .rej conflict files exist
        run: test -z "$(find . -iname '*.rej')"

  pre-commit:
    name: Run Pre-Commit Hooks
    runs-on: ubuntu-latest
    needs: [actionlint, lint-cruft]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
            python-version: "3.12"

      - name: Install and Run Pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      # 1. Pull down the repository code.
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Install Poetry before setting up Python so setup-python can find it for caching
      - name: Install Poetry
        run: pipx install poetry

      # 3. Set up Python and cache Poetry dependencies
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry' # Automatically hashes and caches your poetry.lock

      # 4. Install dependencies defined in pyproject.toml
      - name: Install Dependencies
        run: poetry install --no-interaction
      - name: Set up Python Environment
        uses: ./.github/actions/python-poetry-env
        with:
          python-version: ${{ matrix.python-version }}

      # 5. Run tests via poetry.
      - name: Run Pytest
        run: poetry run pytest
